<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="iGas Cấp Dầu" />
  <link rel="manifest" href="./manifest.json" />
  <title>iGas Cấp Dầu PWA</title>
  <style>
    :root {
      --bg: #f3f6f5;
      --card: #ffffff;
      --primary: #0f766e;
      --danger: #b91c1c;
      --danger-soft-bg: #fee2e2;
      --danger-soft-text: #dc2626;
      --danger-soft-border: #fca5a5;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --ok-bg: #ecfdf5;
      --ok-text: #065f46;
      --warn-bg: #fffbeb;
      --warn-text: #92400e;
      --err-bg: #fef2f2;
      --err-text: #991b1b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .app { max-width: 520px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .title { font-size: 19px; font-weight: 700; margin: 0; }
    .actions { display: flex; gap: 6px; }
    .btn-small {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .mode-switch.single-tab {
      grid-template-columns: 1fr;
    }
    .mode-btn {
      height: 40px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }
    .mode-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.25);
    }
    .mode-btn.delete-tab.active {
      background: var(--danger);
      box-shadow: 0 2px 6px rgba(185, 28, 28, 0.25);
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }
    .field { margin-bottom: 14px; }
    .range-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .hidden { display: none; }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    select, input {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      font-size: 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .range-hint {
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 12px;
      min-height: 18px;
    }
    .btn-primary {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }
    .btn-primary:disabled { opacity: 0.55; }
    .meta {
      font-size: 12px;
      color: var(--muted);
      background: #f8fafc;
      border-radius: 9px;
      padding: 10px 12px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .status {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
      margin-top: 12px;
      white-space: pre-line;
    }
    .status.ok { display: block; background: var(--ok-bg); color: var(--ok-text); }
    .status.warn { display: block; background: var(--warn-bg); color: var(--warn-text); }
    .status.err { display: block; background: var(--err-bg); color: var(--err-text); }

    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .order-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
    }
    .order-item {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #fafafa;
    }
    .order-item.pumped {
      background: #f8fafc;
      border-color: #eef2f6;
      opacity: 0.78;
    }
    .order-main { min-width: 0; }
    .order-title { font-size: 14px; font-weight: 700; }
    .order-sub { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
    .btn-del {
      border: 1px solid var(--danger);
      background: var(--danger);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      cursor: pointer;
    }
    .btn-del.pumped,
    .btn-del:disabled {
      border: 1px solid var(--danger-soft-border);
      background: var(--danger-soft-bg);
      color: var(--danger-soft-text);
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 14px;
      padding: 18px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1 class="title">iGas Cấp Dầu</h1>
      <div class="actions">
        <button type="button" class="btn-small" id="btnOpenLogin">Tài khoản</button>
        <button type="button" class="btn-small" id="btnClearAuth">Xoá lưu</button>
      </div>
    </div>

    <div class="mode-switch single-tab" id="modeSwitch">
      <button type="button" class="mode-btn active" id="btnTabIssue">Phiếu cấp dầu</button>
      <button type="button" class="mode-btn delete-tab hidden" id="btnTabDelete">Xoá phiếu</button>
    </div>

    <!-- Giao diện 1 (Mặc định): Phiếu cấp dầu -->
    <form class="card" id="issueCard">
      <div class="field">
        <label for="customerSelect">1. Khách hàng</label>
        <select id="customerSelect" required>
          <option value="">-- Đang tải khách hàng... --</option>
        </select>
      </div>

      <div class="range-grid">
        <div>
          <label for="fromVehicleSelect">2a. Từ đối tượng</label>
          <select id="fromVehicleSelect" required disabled>
            <option value="">-- Chọn KH --</option>
          </select>
        </div>
        <div>
          <label for="toVehicleSelect">2b. Đến đối tượng</label>
          <select id="toVehicleSelect" required disabled>
            <option value="">-- Chọn KH --</option>
          </select>
        </div>
      </div>
      <div class="range-hint" id="rangeSummary"></div>

      <div class="field">
        <label for="quotaInput">3. Hạn mức cấp (lít)</label>
        <input
          id="quotaInput"
          type="number"
          inputmode="numeric"
          pattern="[0-9]*"
          min="1"
          step="1"
          placeholder="Nhập số lít"
          required
        />
      </div>

      <div class="meta" id="defaultsInfo">
        Ngày cấp: 08:00 hôm nay · Ngày hết hạn: 18:00 hôm nay · Hạn mức 1 lần bơm: theo Hạn mức cấp · Chống trùng: Ngày + Đối tượng + Hạn mức
      </div>

      <button type="submit" class="btn-primary" id="btnSubmit">Tạo phiếu cấp dầu</button>
      <div class="status" id="issueStatus"></div>
    </form>

    <!-- Giao diện 2: Xoá phiếu (chỉ mở khi tài khoản có quyền xóa) -->
    <section class="card hidden" id="deleteCard">
      <div class="filter-row">
        <input
          id="orderFilterInput"
          type="text"
          placeholder="Lọc theo đối tượng (FL02, TT18...) hoặc mã phiếu"
        />
        <button type="button" class="btn-small" style="height:48px;padding:0 14px;" id="btnRefreshOrders">Tải lại</button>
      </div>
      <div class="meta" id="ordersMeta">Đang tải danh sách phiếu trong ngày...</div>
      <div class="order-list" id="orderList"></div>
      <div class="status" id="deleteStatus"></div>
    </section>
  </div>

  <div class="modal-backdrop" id="loginModal">
    <div class="modal">
      <h2 style="margin:0 0 8px;font-size:17px;">Đăng nhập iGas</h2>
      <p style="margin:0 0 12px;font-size:12px;color:#64748b;line-height:1.45;">
        Tài khoản được lưu trực tiếp trên thiết bị này, không lưu lên GitHub.
      </p>
      <div class="field">
        <label for="usernameInput">Tên đăng nhập</label>
        <input id="usernameInput" type="text" autocomplete="username" />
      </div>
      <div class="field">
        <label for="passwordInput">Mật khẩu</label>
        <input id="passwordInput" type="password" autocomplete="current-password" />
      </div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn-small" style="flex:1;height:44px;" id="btnCloseLogin">Đóng</button>
        <button type="button" class="btn-primary" style="flex:2;height:44px;" id="btnDoLogin">Lưu & Tải dữ liệu</button>
      </div>
    </div>
  </div>

  <script>
    // THAY BẰNG URL WORKER CỦA BẠN (KHÔNG CÓ DẤU / Ở CUỐI)
    const WORKER_BASE_URL = "https://igas-proxy.manhthang.workers.dev";
    const STORAGE_KEY = "igas_device_credentials_v1";

    const modeSwitch = document.getElementById("modeSwitch");
    const btnTabIssue = document.getElementById("btnTabIssue");
    const btnTabDelete = document.getElementById("btnTabDelete");
    const issueCard = document.getElementById("issueCard");
    const deleteCard = document.getElementById("deleteCard");

    const customerSelect = document.getElementById("customerSelect");
    const fromVehicleSelect = document.getElementById("fromVehicleSelect");
    const toVehicleSelect = document.getElementById("toVehicleSelect");
    const rangeSummary = document.getElementById("rangeSummary");
    const quotaInput = document.getElementById("quotaInput");
    const defaultsInfo = document.getElementById("defaultsInfo");
    const issueStatus = document.getElementById("issueStatus");
    const btnSubmit = document.getElementById("btnSubmit");

    const orderFilterInput = document.getElementById("orderFilterInput");
    const btnRefreshOrders = document.getElementById("btnRefreshOrders");
    const ordersMeta = document.getElementById("ordersMeta");
    const orderList = document.getElementById("orderList");
    const deleteStatus = document.getElementById("deleteStatus");

    const loginModal = document.getElementById("loginModal");
    const usernameInput = document.getElementById("usernameInput");
    const passwordInput = document.getElementById("passwordInput");

    let currentVehicles = [];
    let todayOrders = [];
    let canDeletePermission = false;

    function getSavedCreds() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.username && parsed.password) {
          return { username: String(parsed.username), password: String(parsed.password) };
        }
      } catch {}
      return null;
    }

    function saveCreds(username, password) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ username, password }));
    }

    function clearCreds() {
      localStorage.removeItem(STORAGE_KEY);
      usernameInput.value = "";
      passwordInput.value = "";
    }

    function authHeaders() {
      const creds = getSavedCreds();
      if (!creds) return {};
      return {
        "X-Igas-User": creds.username,
        "X-Igas-Pass": creds.password,
      };
    }

    function setDeletePermission(allowed) {
      canDeletePermission = Boolean(allowed);
      btnTabDelete.classList.toggle("hidden", !canDeletePermission);
      modeSwitch.classList.toggle("single-tab", !canDeletePermission);
      if (!canDeletePermission) {
        switchTab("issue");
      }
    }

    function switchTab(tab) {
      const isDelete = tab === "delete" && canDeletePermission;
      btnTabIssue.classList.toggle("active", !isDelete);
      btnTabDelete.classList.toggle("active", isDelete);
      issueCard.classList.toggle("hidden", isDelete);
      deleteCard.classList.toggle("hidden", !isDelete);
      if (isDelete) {
        loadTodayOrders();
      }
    }

    btnTabIssue.addEventListener("click", () => switchTab("issue"));
    btnTabDelete.addEventListener("click", () => switchTab("delete"));

    function showBox(el, type, msg) {
      el.className = `status ${type}`;
      el.textContent = msg;
    }

    function clearBox(el) {
      el.className = "status";
      el.textContent = "";
    }

    function getSelectedRangeVehicles() {
      const fromId = fromVehicleSelect.value;
      const toId = toVehicleSelect.value;
      if (!fromId || !toId || currentVehicles.length === 0) return [];

      const idxA = currentVehicles.findIndex((v) => String(v.id) === String(fromId));
      const idxB = currentVehicles.findIndex((v) => String(v.id) === String(toId));
      if (idxA === -1 || idxB === -1) return [];

      const start = Math.min(idxA, idxB);
      const end = Math.max(idxA, idxB);
      return currentVehicles.slice(start, end + 1);
    }

    function updateRangeSummary() {
      const list = getSelectedRangeVehicles();
      if (list.length === 0) {
        rangeSummary.textContent = "";
        return;
      }
      const firstText = list[0].text;
      const lastText = list[list.length - 1].text;
      rangeSummary.textContent =
        list.length === 1
          ? `Sẽ tạo 1 phiếu cho: ${firstText}`
          : `Sẽ tạo ${list.length} phiếu: từ "${firstText}" đến "${lastText}"`;
    }

    function resetVehicleSelects(placeholder) {
      currentVehicles = [];
      fromVehicleSelect.innerHTML = `<option value="">${placeholder}</option>`;
      toVehicleSelect.innerHTML = `<option value="">${placeholder}</option>`;
      fromVehicleSelect.disabled = true;
      toVehicleSelect.disabled = true;
      rangeSummary.textContent = "";
    }

    async function initTicketForm() {
      clearBox(issueStatus);
      const creds = getSavedCreds();
      if (!creds) {
        setDeletePermission(false);
        customerSelect.innerHTML = `<option value="">-- Vui lòng nhập tài khoản --</option>`;
        resetVehicleSelects("-- Chọn KH --");
        loginModal.classList.add("open");
        return;
      }

      customerSelect.innerHTML = `<option value="">-- Đang tải khách hàng... --</option>`;
      resetVehicleSelects("-- Chọn KH --");

      try {
        const res = await fetch(`${WORKER_BASE_URL}/api/init-ticket`, {
          headers: authHeaders(),
        });
        const data = await res.json();
        if (res.status === 401) {
          setDeletePermission(false);
          loginModal.classList.add("open");
          showBox(issueStatus, "err", data.detail || "Tài khoản chưa đúng hoặc hết hiệu lực");
          return;
        }
        if (!res.ok) {
          showBox(issueStatus, "err", data.detail || "Không thể tải danh sách khách hàng");
          return;
        }

        setDeletePermission(Boolean(data.can_delete));

        if (data.defaults) {
          defaultsInfo.textContent =
            `Ngày cấp: ${data.defaults.delivery_time} · Ngày hết hạn: ${data.defaults.expired_time} · Hạn mức 1 lần bơm: theo Hạn mức cấp · Chống trùng: Ngày + Đối tượng + Hạn mức`;
        }

        customerSelect.innerHTML = `<option value="">-- Chọn Khách hàng --</option>`;
        for (const c of data.customers || []) {
          const opt = document.createElement("option");
          opt.value = c.id;
          opt.textContent = c.text;
          customerSelect.appendChild(opt);
        }
      } catch (err) {
        showBox(issueStatus, "err", `Lỗi kết nối Worker: ${err.message}`);
      }
    }

    customerSelect.addEventListener("change", async () => {
      const custId = customerSelect.value;
      clearBox(issueStatus);
      resetVehicleSelects("-- Đang tải... --");

      if (!custId) {
        resetVehicleSelects("-- Chọn KH --");
        return;
      }

      try {
        const res = await fetch(
          `${WORKER_BASE_URL}/api/vehicles?customer_id=${encodeURIComponent(custId)}`,
          { headers: authHeaders() }
        );
        const data = await res.json();
        if (!res.ok) {
          showBox(issueStatus, "err", data.detail || "Không tải được đối tượng cấp");
          resetVehicleSelects("-- Lỗi tải --");
          return;
        }

        const vehicles = data.vehicles || [];
        if (vehicles.length === 0) {
          resetVehicleSelects("-- Không có đối tượng --");
          return;
        }

        currentVehicles = vehicles;
        fromVehicleSelect.innerHTML = `<option value="">-- Từ --</option>`;
        toVehicleSelect.innerHTML = `<option value="">-- Đến --</option>`;

        for (const v of vehicles) {
          const optFrom = document.createElement("option");
          optFrom.value = v.id;
          optFrom.textContent = v.text;
          fromVehicleSelect.appendChild(optFrom);

          const optTo = document.createElement("option");
          optTo.value = v.id;
          optTo.textContent = v.text;
          toVehicleSelect.appendChild(optTo);
        }

        fromVehicleSelect.disabled = false;
        toVehicleSelect.disabled = false;
      } catch (err) {
        showBox(issueStatus, "err", `Lỗi tải đối tượng cấp: ${err.message}`);
        resetVehicleSelects("-- Lỗi tải --");
      }
    });

    // Chọn Từ đối tượng xong tự động điền Đến đối tượng bằng Từ đối tượng
    fromVehicleSelect.addEventListener("change", () => {
      if (fromVehicleSelect.value) {
        toVehicleSelect.value = fromVehicleSelect.value;
      }
      updateRangeSummary();
    });

    toVehicleSelect.addEventListener("change", updateRangeSummary);

    quotaInput.addEventListener("input", () => {
      quotaInput.value = quotaInput.value.replace(/[^0-9]/g, "");
    });

    async function createSingleTicket(customerId, vehicleId, vehicleName, quotaValue) {
      const res = await fetch(`${WORKER_BASE_URL}/api/create-ticket`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...authHeaders(),
        },
        body: JSON.stringify({
          customer_id: customerId,
          vehicle_id: vehicleId,
          vehicle_name: vehicleName,
          quota_value: quotaValue,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        const err = new Error(data.detail || "Tạo phiếu thất bại");
        err.isDuplicate = res.status === 409 || Boolean(data.duplicate);
        throw err;
      }
      return data;
    }

    issueCard.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearBox(issueStatus);

      const creds = getSavedCreds();
      if (!creds) {
        loginModal.classList.add("open");
        return;
      }

      const customer_id = customerSelect.value;
      const quota_value = parseInt(quotaInput.value, 10);
      const targets = getSelectedRangeVehicles();

      if (!customer_id || targets.length === 0 || !quota_value || quota_value <= 0) {
        showBox(issueStatus, "err", "Vui lòng chọn Khách hàng, Đối tượng cấp và nhập Hạn mức cấp > 0.");
        return;
      }

      btnSubmit.disabled = true;
      const successLogs = [];
      const dupLogs = [];
      const errorLogs = [];

      try {
        for (let i = 0; i < targets.length; i++) {
          const item = targets[i];
          btnSubmit.textContent = `Đang xử lý ${i + 1}/${targets.length}: ${item.text}...`;

          try {
            const data = await createSingleTicket(customer_id, item.id, item.text, quota_value);
            const code = data.coupon_code ? ` [${data.coupon_code}]` : "";
            successLogs.push(`• ${item.text}${code}: ${data.quota_value}L`);
          } catch (err) {
            if (err.isDuplicate) {
              dupLogs.push(`• ${item.text}: ${err.message}`);
            } else {
              errorLogs.push(`• ${item.text}: ${err.message}`);
            }
          }
        }

        const parts = [
          `Tạo mới: ${successLogs.length}/${targets.length} · Trùng bỏ qua: ${dupLogs.length} · Lỗi: ${errorLogs.length}`,
        ];
        if (successLogs.length) parts.push(`Đã tạo:\n${successLogs.join("\n")}`);
        if (dupLogs.length) parts.push(`Bỏ qua do trùng:\n${dupLogs.join("\n")}`);
        if (errorLogs.length) parts.push(`Lỗi:\n${errorLogs.join("\n")}`);

        const boxType = errorLogs.length > 0 ? "err" : dupLogs.length > 0 ? "warn" : "ok";
        showBox(issueStatus, boxType, parts.join("\n\n"));

        if (successLogs.length > 0 && errorLogs.length === 0) {
          quotaInput.value = "";
        }
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Tạo phiếu cấp dầu";
      }
    });

    function renderOrderList() {
      const kw = orderFilterInput.value.trim().toLowerCase();
      const filtered = todayOrders.filter((o) => {
        if (!kw) return true;
        return (
          String(o.vehicle_name || "").toLowerCase().includes(kw) ||
          String(o.customer_name || "").toLowerCase().includes(kw) ||
          String(o.coupon_code || "").toLowerCase().includes(kw) ||
          String(o.id || "").toLowerCase().includes(kw)
        );
      });

      orderList.innerHTML = "";
      if (filtered.length === 0) {
        orderList.innerHTML = `<div class="meta">Không có phiếu phù hợp trong ngày.</div>`;
        return;
      }

      for (const o of filtered) {
        const isPumped = Number(o.extract_amount || 0) > 0;
        const div = document.createElement("div");
        div.className = isPumped ? "order-item pumped" : "order-item";

        const info = document.createElement("div");
        info.className = "order-main";
        const codeText = o.coupon_code ? ` · ${o.coupon_code}` : ` · #${o.id}`;
        info.innerHTML = `
          <div class="order-title">${o.vehicle_name || "Đối tượng"} · ${o.quota_value}L${codeText}</div>
          <div class="order-sub">${o.customer_name || ""} · Đã bơm: ${o.extract_amount}L · ${o.delivery_time || ""}</div>
        `;

        const btnDel = document.createElement("button");
        btnDel.type = "button";
        btnDel.className = isPumped ? "btn-del pumped" : "btn-del";
        btnDel.textContent = "Xoá";
        if (isPumped) {
          btnDel.disabled = true;
          btnDel.setAttribute("aria-disabled", "true");
          btnDel.tabIndex = -1;
        } else {
          btnDel.addEventListener("click", () => handleDeleteOrder(o, btnDel));
        }

        div.appendChild(info);
        div.appendChild(btnDel);
        orderList.appendChild(div);
      }
    }

    async function loadTodayOrders() {
      clearBox(deleteStatus);
      ordersMeta.textContent = "Đang tải danh sách phiếu trong ngày...";
      orderList.innerHTML = "";

      try {
        const res = await fetch(`${WORKER_BASE_URL}/api/orders-today`, {
          headers: authHeaders(),
        });
        const data = await res.json();
        if (!res.ok) {
          ordersMeta.textContent = "Không tải được danh sách phiếu";
          showBox(deleteStatus, "err", data.detail || "Lỗi tải danh sách phiếu");
          return;
        }
        todayOrders = data.orders || [];
        ordersMeta.textContent = `Ngày ${data.date}: tổng ${todayOrders.length} phiếu`;
        renderOrderList();
      } catch (err) {
        ordersMeta.textContent = "Lỗi kết nối";
        showBox(deleteStatus, "err", `Lỗi tải danh sách phiếu: ${err.message}`);
      }
    }

    async function handleDeleteOrder(order, btnEl) {
      if (Number(order?.extract_amount || 0) > 0) {
        return;
      }
      const label = `${order.vehicle_name || ""} (${order.quota_value}L)${order.coupon_code ? ` - ${order.coupon_code}` : ""}`;
      if (!confirm(`Xác nhận xoá phiếu ${label}?`)) return;

      btnEl.disabled = true;
      btnEl.textContent = "Đang xoá...";
      clearBox(deleteStatus);

      try {
        const res = await fetch(`${WORKER_BASE_URL}/api/delete-ticket`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...authHeaders(),
          },
          body: JSON.stringify({ id: order.id }),
        });
        const data = await res.json();
        if (!res.ok) {
          showBox(deleteStatus, "err", data.detail || `Không xoá được phiếu ${label}`);
          btnEl.disabled = false;
          btnEl.textContent = "Xoá";
          return;
        }

        showBox(deleteStatus, "ok", `${data.message || "Xoá thông tin thành công"}: ${label}`);
        await loadTodayOrders();
      } catch (err) {
        showBox(deleteStatus, "err", `Lỗi xoá phiếu: ${err.message}`);
        btnEl.disabled = false;
        btnEl.textContent = "Xoá";
      }
    }

    orderFilterInput.addEventListener("input", renderOrderList);
    btnRefreshOrders.addEventListener("click", loadTodayOrders);

    document.getElementById("btnOpenLogin").addEventListener("click", () => {
      const creds = getSavedCreds();
      usernameInput.value = creds?.username || "";
      passwordInput.value = creds?.password || "";
      loginModal.classList.add("open");
    });

    document.getElementById("btnCloseLogin").addEventListener("click", () => {
      loginModal.classList.remove("open");
    });

    document.getElementById("btnClearAuth").addEventListener("click", () => {
      clearCreds();
      setDeletePermission(false);
      customerSelect.innerHTML = `<option value="">-- Đã xoá tài khoản lưu trên máy --</option>`;
      resetVehicleSelects("-- Chọn KH --");
      showBox(issueStatus, "ok", "Đã xoá thông tin đăng nhập lưu trên thiết bị này.");
    });

    document.getElementById("btnDoLogin").addEventListener("click", async () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      if (!username || !password) {
        alert("Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.");
        return;
      }

      try {
        const res = await fetch(`${WORKER_BASE_URL}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.detail || "Đăng nhập thất bại");
          return;
        }
        saveCreds(username, password);
        loginModal.classList.remove("open");
        await initTicketForm();
      } catch (err) {
        alert(`Lỗi kết nối: ${err.message}`);
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
    initTicketForm();
  </script>
</body>
</html>
